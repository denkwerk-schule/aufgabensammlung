name: tasks.json / lernfelder.json automatisch aktualisieren

# Laeuft immer, wenn sich etwas im aufgaben/- oder lernfelder/-Ordner aendert
# (neue Aufgabe, neues Lernfeld, geaenderte metadata.yml, etc.) und schreibt
# tasks.json / lernfelder.json + fehlende Vorschaubilder neu. Dadurch muss die
# index.html nie manuell angepasst werden - neue Inhalte werden automatisch
# erkannt.

on:
  push:
    branches: [main]
    paths:
      - "aufgaben/**"
      - "lernfelder/**"
      - "scripts/build_tasks.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          pip install pyyaml
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils

      - name: tasks.json, lernfelder.json und Vorschaubilder generieren
        run: python3 scripts/build_tasks.py

      - name: Aenderungen committen
        run: |
          git config user.name "denkwerk-bot"
          git config user.email "actions@github.com"
          git add tasks.json lernfelder.json aufgaben lernfelder
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "tasks.json / lernfelder.json automatisch aktualisiert [skip ci]"
            git push
          fi
