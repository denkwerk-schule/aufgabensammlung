schritte:
  - titel: "Begegnen"
    text: "Hör dir den Hörtext ein erstes Mal an, kläre das Hauptthema und formuliere eigene Fragen."
  - titel: "Zuhören"
    text: "Hör dir den Hörtext ein zweites Mal an und achte dabei gezielt auf deine und die vorgegebenen Fragen."
  - titel: "Verarbeiten"
    text: "Stelle den Inhalt des Hörtextes bildlich oder grafisch dar (Mindmap, Tabelle, Zeitstrahl, Skizze)."
  - titel: "Überprüfen"
    text: "Überprüft zu zweit, ob ihr den Inhalt richtig verstanden habt, und vergleicht eure Ergebnisse."
